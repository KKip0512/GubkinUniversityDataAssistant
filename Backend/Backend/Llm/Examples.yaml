- question: "Сколько студентов учится на каждом факультете?"
  sql: |
    SELECT f.name, COUNT(s.student_id) AS students_count
    FROM students s
    JOIN programs p ON p.program_id = s.program_id
    JOIN faculties f ON f.faculty_id = p.faculty_id
    GROUP BY f.name
    ORDER BY students_count DESC

- question: "Сравни средний итоговый балл БРС на факультете экономики и управления и на факультете инженерной механики."
  sql: |
    SELECT f.name, ROUND(AVG(g.brs_score), 1) AS avg_brs
    FROM grades g
    JOIN students s ON s.student_id = g.student_id
    JOIN programs p ON p.program_id = s.program_id
    JOIN faculties f ON f.faculty_id = p.faculty_id
    WHERE g.grade IS NOT NULL
      AND f.name IN ('Факультет экономики и управления', 'Факультет инженерной механики')
    GROUP BY f.name
    ORDER BY avg_brs DESC

- question: "Какой средний итоговый балл БРС по каждой дисциплине?"
  sql: |
    SELECT sub.title AS subject, ROUND(AVG(g.brs_score), 1) AS avg_brs
    FROM grades g
    JOIN subjects sub ON sub.subject_id = g.subject_id
    WHERE g.grade IS NOT NULL
    GROUP BY sub.title
    ORDER BY avg_brs DESC

